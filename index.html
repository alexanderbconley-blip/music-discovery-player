
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Discovery Player</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 20px;
  max-width: 800px;
  margin: auto;
  color: #222;
}
textarea, input, select {
  width: 100%;
  padding: 12px;
  box-sizing: border-box;
  margin: 7px 0;
  font-size: 16px;
}
button {
  padding: 12px 16px;
  margin: 6px 4px 6px 0;
  font-size: 15px;
  border-radius: 6px;
  border: 1px solid #aaa;
  cursor: pointer;
}
button:hover { background: #ddd; }
#player {
  margin-top: 15px;
  min-height: 250px;
}
#status { font-weight: bold; }
iframe { max-width: 100%; }
</style>
</head>

<body>

<h1>Music Discovery Player</h1>
  
<button id="spotifyLogin">Connect Spotify Premium</button>
<p id="spotifyStatus">Spotify not connected.</p>

<p>Discover and play songs from your search prompts.</p>

<h3>YouTube API Key</h3>
<input id="apiKey" type="password"
  placeholder="Enter restricted YouTube API key">
<p><small>For testing. Your key is not saved.</small></p>

<h3>Search Prompts</h3>
<textarea id="searchPrompts" rows="6"
  placeholder="Enter one search prompt per line"></textarea>

<h3>Search Settings</h3>
<label for="searchMode">Search order:</label>
<select id="searchMode">
  <option value="random">Random</option>
  <option value="rotation">Rotation</option>
</select>

<div>
  <button id="startButton">Start Discovery</button>
  <button id="skipButton">Next Search</button>
  <button id="stopButton">Stop</button>
</div>

<h3>Now Playing</h3>
<p id="status">Ready to discover music.</p>
<p id="videoTitle"></p>
<div id="player"></div>

<script>
const promptsInput = document.getElementById("searchPrompts");
const searchMode = document.getElementById("searchMode");
const statusText = document.getElementById("status");
const titleText = document.getElementById("videoTitle");
const apiKeyInput = document.getElementById("apiKey");

let player = null;
let playerReady = false;
let pendingVideo = null;
let running = false;
let searchIndex = 0;
let requestNumber = 0;

const playedVideos = new Set();
const searchCache = new Map();

window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player("player", {
    width: "100%",
    height: "360",
    playerVars: {
      playsinline: 1,
      autoplay: 1,
      origin: window.location.origin
    },
    events: {
      onReady: function () {
        playerReady = true;

        player.getIframe().setAttribute(
          "allow",
          "autoplay; encrypted-media; fullscreen; picture-in-picture"
        );

        if (pendingVideo) {
          playSelectedVideo(pendingVideo);
        }
      },
      onStateChange: function (event) {
        if (event.data === YT.PlayerState.PLAYING) {
          statusText.textContent = "Now playing!";
        }
      },
      onAutoplayBlocked: function () {
        statusText.textContent =
          "Automatic playback was blocked by the browser.";
      },
      onError: function (event) {
        statusText.textContent =
          "YouTube playback error: " + event.data;
      }
    }
  });
};

const script = document.createElement("script");
script.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(script);

function getPrompts() {
  return promptsInput.value
    .split("\n")
    .map(text => text.trim())
    .filter(Boolean);
}

function choosePrompt() {
  const prompts = getPrompts();

  if (searchMode.value === "random") {
    return prompts[Math.floor(Math.random() * prompts.length)];
  }

  const prompt = prompts[searchIndex % prompts.length];
  searchIndex++;
  return prompt;
}

async function getVideos(prompt, key) {
  if (searchCache.has(prompt)) {
    return searchCache.get(prompt);
  }

  const params = new URLSearchParams({
    part: "snippet",
    type: "video",
    videoEmbeddable: "true",
    maxResults: "50",
    q: prompt,
    key: key
  });

  const response = await fetch(
    "https://www.googleapis.com/youtube/v3/search?" +
    params.toString()
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(
      data.error?.message || "YouTube search failed."
    );
  }

  const videos = (data.items || [])
    .filter(item => item.id?.videoId)
    .map(item => ({
      id: item.id.videoId,
      title: item.snippet.title
    }));

  searchCache.set(prompt, videos);
  return videos;
}

function playSelectedVideo(video) {
  pendingVideo = video;
  titleText.textContent = video.title;

  if (!playerReady) {
    statusText.textContent = "Waiting for YouTube player...";
    return;
  }

  statusText.textContent = "Starting video...";

  player.loadVideoById(video.id);
  player.unMute();
  player.playVideo();
}

async function nextSearch() {
  const prompts = getPrompts();
  const key = apiKeyInput.value.trim();

  if (!prompts.length) {
    statusText.textContent = "Enter search prompts first.";
    return;
  }

  if (!key) {
    statusText.textContent = "Enter your YouTube API key.";
    return;
  }

  running = true;
  const currentRequest = ++requestNumber;
  statusText.textContent = "Searching YouTube...";

  try {
    const prompt = choosePrompt();
    const videos = await getVideos(prompt, key);

    if (!running || currentRequest !== requestNumber) return;

    const available = videos.filter(
      video => !playedVideos.has(video.id)
    );

    if (!available.length) {
      statusText.textContent =
        "No new videos for this prompt. Try Next Search.";
      return;
    }

    const video = available[
      Math.floor(Math.random() * available.length)
    ];

    playedVideos.add(video.id);
    playSelectedVideo(video);

  } catch (error) {
    if (currentRequest === requestNumber) {
      statusText.textContent = "Error: " + error.message;
    }
  }
}

document.getElementById("startButton").onclick = () => {
  searchIndex = 0;
  nextSearch();
};

document.getElementById("skipButton").onclick = nextSearch;

document.getElementById("stopButton").onclick = () => {
  running = false;
  requestNumber++;
  pendingVideo = null;

  if (playerReady) {
    player.stopVideo();
  }

  titleText.textContent = "";
  statusText.textContent = "Stopped.";
};
  
const spotifyClientId = "57ba085f8fe8486aa6c7167eb6207d72";
const spotifyRedirect = "https://alexanderbconley-blip.github.io/music-discovery-player/";
const spotifyStatus = document.getElementById("spotifyStatus");

function base64url(bytes) {
  return btoa(String.fromCharCode(...bytes))
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

async function connectSpotify() {
  const bytes = crypto.getRandomValues(new Uint8Array(64));
  const verifier = base64url(bytes);
  const digest = await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(verifier)
  );
  const challenge = base64url(new Uint8Array(digest));
  const state = base64url(
    crypto.getRandomValues(new Uint8Array(16))
  );

  sessionStorage.setItem("spotify_verifier", verifier);
  sessionStorage.setItem("spotify_state", state);

  const params = new URLSearchParams({
    client_id: spotifyClientId,
    response_type: "code",
    redirect_uri: spotifyRedirect,
    code_challenge_method: "S256",
    code_challenge: challenge,
    state: state,
    scope: [
      "streaming",
      "user-read-private",
      "user-read-playback-state",
      "user-modify-playback-state"
    ].join(" ")
  });

  window.location.href =
    "https://accounts.spotify.com/authorize?" + params;
}

document.getElementById("spotifyLogin")
  .addEventListener("click", connectSpotify);

async function handleSpotifyCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const error = params.get("error");

  if (!code && !error) return;

  if (error) {
    spotifyStatus.textContent = "Spotify authorization: " + error;
    return;
  }

  const expectedState = sessionStorage.getItem("spotify_state");

  if (!expectedState ||
      params.get("state") !== expectedState) {
    spotifyStatus.textContent = "Spotify security check failed.";
    return;
  }

  const verifier = sessionStorage.getItem("spotify_verifier");

  try {
    const response = await fetch(
      "https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams({
          client_id: spotifyClientId,
          grant_type: "authorization_code",
          code: code,
          redirect_uri: spotifyRedirect,
          code_verifier: verifier
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error_description || data.error);
    }

    // Store the access token for this browser tab only.
    sessionStorage.setItem(
      "spotify_access_token",
      data.access_token
    );

    spotifyStatus.textContent =
      "Spotify Premium connected successfully!";

    history.replaceState({}, "", spotifyRedirect);

  } catch (error) {
    spotifyStatus.textContent =
      "Spotify connection failed: " + error.message;
  } finally {
    sessionStorage.removeItem("spotify_verifier");
    sessionStorage.removeItem("spotify_state");
  }
}

handleSpotifyCallback();

if (sessionStorage.getItem("spotify_access_token")) {
  spotifyStatus.textContent =
    "Spotify authorized for this browser session.";
}

</script>

</body>
</html>
